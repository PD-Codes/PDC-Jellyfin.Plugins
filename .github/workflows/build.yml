name: build

# Builds and packages every plugin in this repository. On a tag matching "<prefix>-v*"
# (a PLUGIN-PREFIXED tag, e.g. "pdcodesapi-v1.0.0.0" - see plugins/README.md for the
# convention) the matrix entry whose tag_prefix matches also publishes a GitHub Release
# with that plugin's ZIP attached - that release asset is what manifest.json's sourceUrl
# for that plugin points at (github.com/PD-Codes/PDC-Jellyfin.Plugins/releases/download/{tag}/{zip_name}).
# Everything else (branch pushes, pull requests, and every OTHER matrix entry on a tag
# push) only builds and uploads a CI artifact; the release step is gated on both the tag
# AND which plugin it names, and does not run otherwise.
#
# MANUAL RUNS ("Run workflow" in the Actions tab): pick the plugin to build from the
# dropdown. That alone only builds - same as a branch push. To ALSO cut a release without
# waiting on a tag push, additionally fill in "release_tag" with the exact tag this
# release would have had (e.g. "pdcodesapi-v1.0.0.0"). Only the matrix entry matching
# "plugin" actually does anything for a manual dispatch; every other plugin's job still
# spins up (the "matrix" context is not available in a job-level "if" - only in a step's -
# so there is no way to stop the OTHER jobs being scheduled at all) but every one of its
# steps is skipped via the gate step below, so nothing is built or released for them.
#
# AFTER a release is published, the workflow ALSO updates manifest.json itself using
# .github/scripts/update_manifest.py, commits as github-actions[bot], and pushes straight
# to "main". As of the tag-vs-version incident below, this now CREATES the versions[]
# entry too (changelog + targetAbi come from build.yaml, read once by the "Read
# build.yaml" step below) if one for this version does not exist yet - it still refuses
# outright if the plugin's GUID has no entry in manifest.json at all, which needs a
# one-time by-hand base entry (name/description/owner/category - see plugins/README.md).
#
# THE TAG-VS-BUILD.YAML.VERSION CHECK. Three real tags - pdcodesapi-v1.0.0.0, -v1.0.0.1,
# -v1.0.0.2 - were pushed while build.yaml's "version" stayed "1.0.0.0" the whole time.
# Nothing caught it: a tag push was only checked against the PATTERN "<prefix>-v*", and a
# manual dispatch's release_tag was only checked for the right prefix. Every one of those
# three ZIPs had the same assembly version baked in, so Jellyfin never saw anything to
# update to, no matter how many releases were cut. The "Verify release tag matches
# build.yaml version" step below is what closes that gap - it fails the run outright if
# the tag being released does not equal "<tag_prefix>-v" + build.yaml's version.

on:
  push:
    branches: [ main, master ]
    # Tag pattern is "<prefix>-v*", NOT bare "v*": tags are per-plugin-prefixed now that
    # this repo can hold more than one plugin, and a bare "v1.0.0.0" would not say which
    # plugin's release it is. See plugins/README.md for the tag-prefix convention.
    tags: [ '*-v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Which plugin to build (must match a matrix "id" below)'
        required: true
        type: choice
        options:
          - PdCodesApi
      release_tag:
        description: >-
          Optional. Set to "<tag_prefix>-v<version>" (e.g. "pdcodesapi-v1.0.0.0") to ALSO
          create/update a GitHub Release for this run, without waiting on a tag push.
          Leave empty to just build. Must start with the chosen plugin's own tag_prefix -
          the workflow refuses to run otherwise rather than cut a release under the wrong name.
        required: false
        type: string

permissions:
  contents: write
  # write is only exercised by the release step below, which only runs for the matrix
  # entry whose tag_prefix matches the pushed tag (or, for a manual run, the chosen
  # "plugin" input plus a non-empty "release_tag"). Branch pushes, pull requests, and
  # every other matrix entry never reach it and never write anything. This is broader
  # than any single release step strictly needs (every matrix entry's job gets the same
  # permission even though only one of them uses it) - splitting the release into its own
  # job with a narrower token is a reasonable future pass, left out here as out of scope
  # for this restructuring.

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      # One matrix entry per plugin in this repo. Adding a plugin means adding an entry
      # here AND a new option under workflow_dispatch.inputs.plugin above - see
      # plugins/README.md, "what else must be updated when a plugin is added". Forgetting
      # either is silent: the new plugin's folder can be complete and its own build.yaml
      # correct, and CI simply never looks at it (or never offers it in the dropdown).
      fail-fast: false
      matrix:
        plugin:
          - id: PdCodesApi
            tag_prefix: pdcodesapi
            project: plugins/PdCodesApi/Jellyfin.Plugin.PdCodesApi/Jellyfin.Plugin.PdCodesApi.csproj
            assembly: Jellyfin.Plugin.PdCodesApi
            zip_name: pdcodesapi.zip

    steps:
      - name: Gate on selected plugin (${{ matrix.plugin.id }})
        # The "matrix" context is only available in a STEP's "if", not a job's - putting
        # this check at the job level is a hard workflow-parse error ("Unrecognized
        # named-value: 'matrix'"), which is why it lives here instead. Every other step
        # below reads this step's output; for a manual dispatch of a DIFFERENT plugin they
        # all skip, so this matrix entry's job still gets scheduled but does nothing.
        # Push/PR triggers have no such input at all, so should_run is always true for them.
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ github.event.inputs.plugin }}" != "${{ matrix.plugin.id }}" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Read build.yaml (${{ matrix.plugin.id }})
        # ONE parsed source for guid/version/changelog/targetAbi, used below both by the
        # tag-consistency check and by the manifest update step. Real YAML parsing (not
        # grep/sed) because `changelog: >` is a folded block scalar - grep/sed can only
        # safely pull single-line scalars like guid/version, which is exactly how this
        # workflow used to read them, and exactly why nothing ever caught build.yaml's
        # version drifting away from the git tag being released.
        if: steps.gate.outputs.should_run == 'true'
        id: meta
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          META=$(python3 .github/scripts/extract_build_meta.py "plugins/${{ matrix.plugin.id }}/build.yaml")
          echo "guid=$(echo "$META" | python3 -c 'import json,sys; print(json.load(sys.stdin)["guid"])')" >> "$GITHUB_OUTPUT"
          echo "version=$(echo "$META" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')" >> "$GITHUB_OUTPUT"
          echo "target_abi=$(echo "$META" | python3 -c 'import json,sys; print(json.load(sys.stdin)["targetAbi"])')" >> "$GITHUB_OUTPUT"
          {
            echo 'changelog<<CHANGELOG_EOF'
            echo "$META" | python3 -c 'import json,sys; print(json.load(sys.stdin)["changelog"])'
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Resolve release tag (${{ matrix.plugin.id }})
        # Moved ahead of the build steps (it used to sit right before the release step) so
        # the tag-consistency check below has it available before anything is built. Tag-
        # push and manual-dispatch releases need the tag from different places: a tag push
        # already has it in the ref, a manual dispatch has no ref to read it from and must
        # use the "release_tag" input instead.
        if: steps.gate.outputs.should_run == 'true'
        id: resolve_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag_name=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate manual release tag (${{ matrix.plugin.id }})
        # Only reached on a manual dispatch of THIS plugin that also asked for a release.
        # Refuses a release_tag that does not start with THIS plugin's own prefix - e.g.
        # picking "PdCodesApi" from the dropdown but pasting a different plugin's tag -
        # rather than silently cutting a release under a tag that does not match what is
        # inside the ZIP. A crash here is the right outcome; a wrongly-named release is not.
        if: >
          steps.gate.outputs.should_run == 'true'
          && github.event_name == 'workflow_dispatch'
          && github.event.inputs.release_tag != ''
        run: |
          set -euo pipefail
          case "${{ github.event.inputs.release_tag }}" in
            ${{ matrix.plugin.tag_prefix }}-v*) ;;
            *)
              echo "::error::release_tag '${{ github.event.inputs.release_tag }}' does not start with '${{ matrix.plugin.tag_prefix }}-v', which ${{ matrix.plugin.id }} requires. Refusing to create a mismatched release."
              exit 1
              ;;
          esac

      - name: Verify release tag matches build.yaml version (${{ matrix.plugin.id }})
        # THE CHECK THAT WAS MISSING. Nothing previously compared the tag being released
        # against build.yaml's own "version" field - a tag push only had to match the
        # PATTERN "<prefix>-v*", not any particular version, and a manual dispatch's
        # release_tag was only checked for the right prefix (immediately above). It is
        # entirely possible to bump nothing in build.yaml, push a new tag anyway, and get a
        # release whose ZIP's actual assembly version is unchanged - which is exactly what
        # happened across pdcodesapi-v1.0.0.0, -v1.0.0.1 and -v1.0.0.2: three tags, one real
        # version (1.0.0.0), so Jellyfin never saw anything to update to.
        #
        # Only runs when this matrix entry is actually about to be released (same condition
        # as the "Publish GitHub Release" step below) - a plain CI build on a branch push or
        # PR has no release tag to compare against and must not be gated on one.
        if: >
          steps.gate.outputs.should_run == 'true'
          && (startsWith(github.ref, format('refs/tags/{0}-v', matrix.plugin.tag_prefix))
              || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''))
        run: |
          set -euo pipefail
          EXPECTED="${{ matrix.plugin.tag_prefix }}-v${{ steps.meta.outputs.version }}"
          ACTUAL="${{ steps.resolve_tag.outputs.tag_name }}"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Release tag '$ACTUAL' does not match build.yaml's version ($EXPECTED expected). Bump 'version:' in plugins/${{ matrix.plugin.id }}/build.yaml to match the tag before releasing - otherwise the built ZIP's own assembly version does not change and Jellyfin will never offer this as an update."
            exit 1
          fi

      - name: Set up .NET 8
        # Jellyfin 10.10.x targets .NET 8. Building against a newer SDK's default
        # framework produces a DLL the server loads and then skips.
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore (${{ matrix.plugin.id }})
        if: steps.gate.outputs.should_run == 'true'
        run: dotnet restore ${{ matrix.plugin.project }}

      - name: Build (${{ matrix.plugin.id }})
        # -warnaserror is intentional. This project cannot be tested against a live
        # Jellyfin in CI, so the compiler is the only automated check there is; letting
        # warnings accumulate throws that away.
        if: steps.gate.outputs.should_run == 'true'
        run: >
          dotnet build ${{ matrix.plugin.project }}
          --configuration Release
          --no-restore
          -warnaserror

      - name: Publish (${{ matrix.plugin.id }})
        if: steps.gate.outputs.should_run == 'true'
        run: >
          dotnet publish ${{ matrix.plugin.project }}
          --configuration Release
          --no-build
          --output ./publish

      - name: Package (${{ matrix.plugin.id }})
        # Only the plugin assembly goes in the ZIP. Jellyfin supplies its own
        # MediaBrowser.* assemblies at runtime; shipping copies of them is how a plugin
        # ends up loading a different version of the very types it is implementing.
        if: steps.gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          mkdir -p ./artifact
          cp ./publish/${{ matrix.plugin.assembly }}.dll ./artifact/
          cd ./artifact
          zip -r ../${{ matrix.plugin.zip_name }} .
          cd ..
          echo "MD5 (for manifest.json checksum):"
          md5sum ${{ matrix.plugin.zip_name }}

      - name: Upload artifact (${{ matrix.plugin.id }})
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-plugin-${{ matrix.plugin.tag_prefix }}
          path: ${{ matrix.plugin.zip_name }}
          if-no-files-found: error

      - name: Publish GitHub Release (${{ matrix.plugin.id }})
        # Gated on: this matrix entry being the selected plugin, AND EITHER a tag push
        # whose prefix matches it OR a manual dispatch that supplied a release_tag
        # (already validated above to carry the right prefix). This is the only step with
        # contents:write in practice.
        #
        # This is the one place in the workflow where "runs" and "does something" diverge
        # on a tag push, deliberately, and it is worth calling out explicitly: on a
        # "pdcodesapi-v1.0.0.0" tag push, EVERY matrix entry's job still runs its build
        # above (cheap, and it doubles as a build-sanity-check for every plugin in the
        # repo on every tag push) - but only the entry whose tag_prefix is "pdcodesapi"
        # reaches this step and actually creates a release / uploads an asset. Every
        # other plugin's job for the same run ends after the artifact upload, having
        # built successfully and released nothing. Do not read "the workflow ran" as "my
        # plugin's release was cut" - check which matrix entry's release step fired. A
        # manual dispatch does not have this ambiguity in what gets RELEASED (only the
        # chosen plugin's release_tag validation can pass), though every other plugin's
        # job still runs its (skipped) steps per the gate step above.
        #
        # The release's tag becomes part of manifest.json's sourceUrl for this plugin
        # (.../releases/download/{tag}/{zip_name}), so the tag used here MUST be
        # "{tag_prefix}-v" + build.yaml's version exactly, or the manifest points at a
        # release that does not exist.
        if: >
          steps.gate.outputs.should_run == 'true'
          && (startsWith(github.ref, format('refs/tags/{0}-v', matrix.plugin.tag_prefix))
              || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''))
        id: publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag_name }}
          files: ${{ matrix.plugin.zip_name }}
          generate_release_notes: true

      - name: Update manifest.json for this release (${{ matrix.plugin.id }})
        # Gated on "steps.publish_release.outcome == 'success'" rather than re-deriving
        # the tag/dispatch condition above a second time: reusing the release step's own
        # outcome means there is exactly one place that decides whether a release
        # happened, instead of two independently maintained copies of that boolean that
        # could drift apart.
        #
        # Switches to the tip of "main" before editing: this job's own checkout may be a
        # detached tag commit (on a tag push) or an older commit (on a manual dispatch
        # against a stale branch), and manifest.json must be edited and committed against
        # the repository's actual current state, not whatever commit happened to trigger
        # this run. The already-built ZIP sits in the workspace as an untracked file and
        # is unaffected by the branch switch, so its checksum stays valid.
        if: steps.gate.outputs.should_run == 'true' && steps.publish_release.outcome == 'success'
        run: |
          set -euo pipefail

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          ZIP="${{ matrix.plugin.zip_name }}"
          MD5=$(md5sum "$ZIP" | cut -d' ' -f1)
          TAG="${{ steps.resolve_tag.outputs.tag_name }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SOURCE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ZIP}"

          echo "Updating manifest.json: guid=${{ steps.meta.outputs.guid }} version=${{ steps.meta.outputs.version }} checksum=$MD5"
          python3 .github/scripts/update_manifest.py \
            "${{ steps.meta.outputs.guid }}" \
            "${{ steps.meta.outputs.version }}" \
            "$MD5" \
            "$TIMESTAMP" \
            "$SOURCE_URL" \
            "${{ steps.meta.outputs.changelog }}" \
            "${{ steps.meta.outputs.target_abi }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json

          if git diff --cached --quiet; then
            echo "manifest.json already matches this release; nothing to commit."
          else
            git commit -m "chore(manifest): ${{ matrix.plugin.id }} ${TAG} - checksum and timestamp"
            git push origin HEAD:main
          fi
